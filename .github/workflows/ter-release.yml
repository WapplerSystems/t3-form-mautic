name: TER release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to publish, e.g. 14.1.1'
        required: true

jobs:
  ter-release:
    name: TER release
    runs-on: ubuntu-latest
    env:
      TYPO3_EXTENSION_KEY: form_mautic
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
      VERSION: ${{ inputs.version || github.ref_name }}
      REPOSITORY_URL: https://github.com/${{ github.repository }}

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Version in ext_emconf.php and composer.json must match the tag
        run: |
          grep -q "'version' => '${VERSION}'" ext_emconf.php || { echo "ext_emconf.php does not declare ${VERSION}"; exit 1; }
          grep -q "\"version\": \"${VERSION}\"" composer.json || { echo "composer.json does not declare ${VERSION}"; exit 1; }

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, xml, zip, curl
          tools: composer

      - name: Install tailor
        run: composer global require typo3/tailor --prefer-dist --no-progress

      - name: Publish ${{ env.VERSION }} to TER
        run: >
          "$(composer global config bin-dir --absolute --quiet)/tailor" ter:publish "${VERSION}"
          --artefact="${REPOSITORY_URL}/archive/refs/tags/${VERSION}.zip"
          --comment="Release ${VERSION}, see ${REPOSITORY_URL}/releases/tag/${VERSION}"
